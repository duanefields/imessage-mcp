[project]
name = "imessage-mcp"
version = "0.1.0"
description = "iMessage Model Context Protocol (MCP) server"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["imessage", "mcp", "model-context-protocol", "macos"]
dependencies = [
    "fastmcp>=3.0.0,<4",
    "pytypedstream>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
imessage-mcp = "imessage_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imessage_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
